name: oidc-probe
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mint and probe
        env:
          API: https://actions.macroscope.com/api/v1/github-actions/agent-runs
        run: |
          set -x
          mint() {
            local aud="$1"
            curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${aud}" | jq -r .value
          }
          T_OK=$(mint macroscope)
          echo "TOKEN_LEN=${#T_OK}"
          echo "TOKEN_OK=$T_OK" | head -c 300; echo
          echo "=== A: valid aud, empty body ==="
          curl -sS -o /tmp/a.json -w "HTTP=%{http_code}\n" -X POST -H "Authorization: Bearer $T_OK" -H "Content-Type: application/json" -d '{}' "$API"
          cat /tmp/a.json; echo
          echo "=== B: valid aud, junk body ==="
          curl -sS -o /tmp/b.json -w "HTTP=%{http_code}\n" -X POST -H "Authorization: Bearer $T_OK" -H "Content-Type: application/json" -d '{"foo":"bar"}' "$API"
          cat /tmp/b.json; echo
          echo "=== C: wrong audience token ==="
          T_BAD=$(mint "https://github.com/awley-del")
          curl -sS -o /tmp/c.json -w "HTTP=%{http_code}\n" -X POST -H "Authorization: Bearer $T_BAD" -H "Content-Type: application/json" -d '{}' "$API"
          cat /tmp/c.json; echo
          echo "=== D: token claims ==="
          python3 - "$T_OK" <<'PY'
import sys,base64,json
t=sys.argv[1].split('.')
def d(s): return json.loads(base64.urlsafe_b64decode(s+'='*(-len(s)%4)))
print(json.dumps(d(t[1]),indent=1))
print("header",json.dumps(d(t[0])))
PY
