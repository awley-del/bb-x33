name: oidc-probe
on:
  push:
    paths:
      - '.trigger'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mint and probe
        run: |
          API="https://actions.macroscope.com/api/v1/github-actions/agent-runs"
          U=$(env | awk -F= '/^ACTIONS_ID_[A-Z_]*REQUEST_URL=/ {sub(/^[^=]*=/,"");print;exit}')
          T=$(env | awk -F= '/^ACTIONS_ID_[A-Z_]*REQUEST_/ && !/URL=/ {sub(/^[^=]*=/,"");print;exit}')
          echo "url_set=${#U} req_set=${#T}"
          mint() { curl -sS -H "Authorization: bearer $T" "${U}&audience=$1" | jq -r .value; }
          OK=$(mint macroscope)
          echo "TOKLEN=${#OK}"
          echo "A valid-aud empty body:"
          curl -sS -o /tmp/a.json -w "HTTP=%{http_code}\n" -X POST -H "Authorization: Bearer $OK" -H "Content-Type: application/json" -d '{}' "$API"
          cat /tmp/a.json; echo
          echo "B valid-aud junk body:"
          curl -sS -o /tmp/b.json -w "HTTP=%{http_code}\n" -X POST -H "Authorization: Bearer $OK" -H "Content-Type: application/json" -d '{"zz":"yy"}' "$API"
          cat /tmp/b.json; echo
          echo "C wrong-aud token:"
          BAD=$(mint "https://github.com/awley-del")
          curl -sS -o /tmp/c.json -w "HTTP=%{http_code}\n" -X POST -H "Authorization: Bearer $BAD" -H "Content-Type: application/json" -d '{}' "$API"
          cat /tmp/c.json; echo
          echo "D payload claims:"
          echo "$OK" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -m json.tool 2>/dev/null || echo "(pad issue)"
          echo "E token head:"; echo "$OK" | cut -c1-30
